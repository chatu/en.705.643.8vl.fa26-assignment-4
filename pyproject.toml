[project]
name = "ucf50-lrcn"
version = "0.1.0"
description = "LRCN video action recognition on UCF50"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pylint.typecheck]
# OpenCV's cv2 package loads its compiled module at import time, so pylint cannot see its
# members and would report every cv2 call as an error.
generated-members = ["cv2.*"]

[tool.pylint.design]
# Training and evaluation functions take a model, loaders, optimiser, scheduler, device and
# a few settings; bundling those into a config object only to satisfy the default of 5 would
# hide what each function needs. The same reasoning covers locals: the training loop in
# train() has 20, the most of any function.
max-args = 9
max-positional-arguments = 9
max-locals = 20
